# Compose override for the Kyutai Unmute stack → agentbox voice meta-controller.
#
# Run from INSIDE agentbox (host docker socket), from the unmute clone at
# project/voice-stack/unmute:
#   cd ~/workspace/project/voice-stack/unmute
#   docker compose -f docker-compose.yml -f ../unmute-override.yml \
#     up -d --build traefik frontend backend stt tts voice-console
#
# IMPORTANT: every bind mount below is an ABSOLUTE HOST path under
# /mnt/mldata/githubs/AR-AI-Knowledge-Graph (≡ container ~/workspace/project).
# Relative binds in the stock compose would resolve against the container's
# cwd and be auto-created as empty dirs on the host — silently wrong.
#
# What it changes vs stock Unmute:
#   - drops the vLLM `llm` service (profiles: disabled)
#   - backend "LLM" = tab0-bridge http://agentbox:8971 on visionclaw_network
#   - pins STT/TTS to the RTX A6000 (host CUDA device 0)
#   - moves traefik off host port 80 → 8990
#   - adds voice-console: caddy self-signed TLS — :8444 custom console
#     (live tab-0 feed + send box), :8443 the Unmute UI origin

x-host-root: &hostroot /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack

services:
  llm:
    profiles: ["disabled"]

  backend:
    # Stock unmute ships no restart policy — without unless-stopped a host
    # reboot or daemon restart leaves the whole voice plane down.
    restart: unless-stopped
    environment:
      - KYUTAI_LLM_URL=http://agentbox:8971
      # 0 disables the "..." long-silence nudge — the voice agent stays quiet
      # unless spoken to (the bridge also drops "..." turns, belt and braces).
      - UNMUTE_USER_SILENCE_TIMEOUT=0
      # Global speaking pace, all voices: server-side WSOLA time-stretch
      # (unmute/tts/time_stretch.py) — >1 is faster, pitch preserved.
      # Operator preference: very fast. Clamped to [0.5, 3].
      - UNMUTE_TTS_SPEED=1.4
      # Fast-iteration barge-in profile (operator preference):
      #   session-start VAD grace 3s → 0.5s
      #   VAD trigger threshold 0.4 → 0.6 (fires on shorter speech)
      #   client audio lead 4 → 2 frames (~160ms residue after interrupt;
      #   the embed also hard-resets its buffer on the interrupt event)
      - UNMUTE_UNINTERRUPTIBLE_SEC=0.5
      - UNMUTE_INTERRUPT_PAUSE_THRESHOLD=0.6
      - UNMUTE_AUDIO_LEAD_FRAMES=2
    volumes: !override
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/unmute:/app/unmute
    networks:
      - default
      - visionclaw

  frontend:
    restart: unless-stopped
    volumes: !override
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/frontend/src:/app/src

  stt:
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes: !override
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/hf-cache:/root/.cache/huggingface
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/cargo-registry-stt:/root/.cargo/registry
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/stt-target:/app/target
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/uv-cache:/root/.cache/uv
      - /tmp/models/:/models
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/stt-logs:/tmp/unmute_logs

  tts:
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes: !override
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/hf-cache:/root/.cache/huggingface
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/cargo-registry-tts:/root/.cargo/registry
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/tts-target:/app/target
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/uv-cache:/root/.cache/uv
      - /tmp/models/:/models
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/unmute/volumes/tts-logs:/tmp/unmute_logs

  traefik:
    restart: unless-stopped
    # Host daemon requires docker API >= 1.40; traefik v3.3.1 negotiates too
    # low without this. (Our TLS origins bypass traefik anyway — caddy routes
    # straight to backend/frontend — this just keeps the stock :8990 entry sane.)
    environment:
      - DOCKER_API_VERSION=1.44
    ports: !override
      - "8990:80"

  voice-console:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8444:8444"
    volumes:
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/console/Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/console/site:/srv:ro
      - /mnt/mldata/githubs/AR-AI-Knowledge-Graph/voice-stack/console/certs:/certs:ro
      - voice-console-data:/data
    networks:
      - default
      - visionclaw

volumes:
  voice-console-data:

networks:
  visionclaw:
    external: true
    name: visionclaw_network
