# Extension fields for DRY configuration
x-common-environment: &common-environment
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  CUDA_ARCH: ${CUDA_ARCH:-75}
  SYSTEM_NETWORK_PORT: ${SYSTEM_NETWORK_PORT:-4000}
  # MCP and Claude Flow configuration
  CLAUDE_FLOW_HOST: ${CLAUDE_FLOW_HOST:-agentic-workstation}
  MCP_HOST: ${MCP_HOST:-agentic-workstation}
  MCP_TCP_PORT: ${MCP_TCP_PORT:-9500}
  MCP_TRANSPORT: ${MCP_TRANSPORT:-tcp}
  MCP_RECONNECT_ATTEMPTS: ${MCP_RECONNECT_ATTEMPTS:-3}
  MCP_RECONNECT_DELAY: ${MCP_RECONNECT_DELAY:-1000}
  MCP_CONNECTION_TIMEOUT: ${MCP_CONNECTION_TIMEOUT:-30000}
  ORCHESTRATOR_WS_URL: ${ORCHESTRATOR_WS_URL:-ws://mcp-orchestrator:9001/ws}
  MCP_RELAY_FALLBACK_TO_MOCK: ${MCP_RELAY_FALLBACK_TO_MOCK:-true}
  BOTS_ORCHESTRATOR_URL: ${BOTS_ORCHESTRATOR_URL:-ws://agentic-workstation:3002}
  MANAGEMENT_API_HOST: ${MANAGEMENT_API_HOST:-agentic-workstation}
  MANAGEMENT_API_PORT: ${MANAGEMENT_API_PORT:-9090}
  # Solid pod storage (embedded solid-pod-rs, replaces JSS sidecar)
  SOLID_DATA_ROOT: ${SOLID_DATA_ROOT:-/data/solid}

x-common-healthcheck: &common-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-gpu-resources: &gpu-resources
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu, compute, utility]

services:
  # Unified VisionClaw service with profile-based configuration
  visionclaw:
    container_name: ${CONTAINER_NAME:-visionclaw_container}
    hostname: ${HOSTNAME:-visionclaw-server}
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.unified}
      target: development
      args:
        CUDA_ARCH: ${CUDA_ARCH:-75}
        BUILD_TARGET: ${BUILD_TARGET:-development}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      <<: *common-environment
      # Development-specific variables (overridden in production profile)
      NODE_ENV: ${NODE_ENV:-development}
      VITE_DEBUG: ${DEBUG_ENABLED:-true}
      VITE_DEV_SERVER_PORT: ${VITE_DEV_SERVER_PORT:-5173}
      VITE_API_PORT: ${VITE_API_PORT:-4000}
      VITE_HMR_PORT: ${VITE_HMR_PORT:-24678}
      RUST_LOG: ${RUST_LOG:-info,actix_web=warn,actix_server=warn,actix_http=warn,h2=warn,hyper=warn,rustls=warn,reqwest=warn,oxigraph=warn,horned_owl=warn,whelk=warn,solid_pod_rs=warn,visionclaw-server::actors::gpu::force_compute_actor=warn,visionclaw-server::handlers::socket_flow_handler=warn}
      RUST_LOG_REDIRECT: ${RUST_LOG_REDIRECT:-true}
      DOCKER_ENV: ${DOCKER_ENV:-true}
      # Dev-only: bypass Nostr auth for settings writes (never set in production)
      SETTINGS_AUTH_BYPASS: "${SETTINGS_AUTH_BYPASS:-false}"
      # Dev-only: LAN-local full auth bypass for a 100%-local headset (the HP
      # over the rail). When "1"/"true", EVERY request is granted dev-admin with
      # no NIP-98/token/peer check — kills all write-auth friction on the dev
      # headset. Default OFF; opt in with VISIONCLAW_DEV_MODE=1 in .env/environ.
      # Compiled only into dev/`dev-auth` builds; a release binary REFUSES TO
      # BOOT if this is set (ADR-06 §D11), so it can never reach production.
      #
      # SCOPE (codex review, ADR-2039): this line lives in the DEV service only —
      # NOT in the `*common-environment` anchor and NOT in the production service —
      # so the always-present `:-0` default is injected only into the dev build
      # (which does not boot-refuse). A release deploy never receives it here.
      # Caveat: both services load `env_file: .env`; do NOT put VISIONCLAW_DEV_MODE
      # in a `.env` shared with a prod deployment, or the release binary will
      # (by design, §D11) refuse to boot on the mere presence of the var.
      VISIONCLAW_DEV_MODE: "${VISIONCLAW_DEV_MODE:-0}"
      # ADR-142 multi-user RBAC (defaults are fail-closed; these preserve the
      # current single-operator behaviour *visibly*):
      #  - RBAC_PUBLIC_READS=1 keeps anonymous /api GET reads open (client fetches
      #    graph data pre-auth). Set to 0 to require auth on every read.
      #  - RBAC_ALLOW_OWNERLESS=1 permits startup with no Owner assigned (the
      #    POWER_USER_PUBKEYS→Admin fallback is the intended reality here). Once
      #    an Owner is bootstrapped via RBAC_OWNER_PUBKEY, set this to 0.
      RBAC_PUBLIC_READS: "${RBAC_PUBLIC_READS:-1}"
      RBAC_ALLOW_OWNERLESS: "${RBAC_ALLOW_OWNERLESS:-1}"
      RBAC_OWNER_PUBKEY: "${RBAC_OWNER_PUBKEY:-}"
      #  - RBAC_DEFAULT_ROLE: role for authenticated pubkeys with no explicit
      #    assignment. 'editor' (default) preserves pre-RBAC write access for
      #    any valid signer; 'viewer' is the multi-user-locked posture (unknown
      #    signers read only until granted a role). Unrecognised values fail
      #    closed to viewer.
      RBAC_DEFAULT_ROLE: "${RBAC_DEFAULT_ROLE:-editor}"
      # ADR-060 pubkey-visibility drop-set filter. Default ON (secure by
      # default): private nodes not owned by the session pubkey are dropped from
      # the wire frame for anonymous/unauthorised sessions. Public nodes are
      # unaffected, so this is behaviour-neutral for all-public deployments.
      # Opt out with 0/false/off/no.
      PUBKEY_VISIBILITY_FILTER: "${PUBKEY_VISIBILITY_FILTER:-1}"
      # Solid pod storage (embedded solid-pod-rs)
      SOLID_DATA_ROOT: ${SOLID_DATA_ROOT:-/data/solid}
      # Nostr bead provenance bridge — scoped to visionclaw only (privkey must not leak to other containers)
      # Bridge pubkey: eb47d8a792a4709329270a9f85f012326c61867a913791dc5f89dc7a0a760754
      VISIONCLAW_NOSTR_PRIVKEY: ${VISIONCLAW_NOSTR_PRIVKEY:-}
      FORUM_RELAY_URL: ${FORUM_RELAY_URL:-wss://dreamlab-nostr-relay.solitary-paper-764d.workers.dev}
    volumes:
      # Data volumes - ALWAYS mounted (both dev and prod)
      - visionclaw-data:/app/data
      - visionclaw-logs:/app/logs
      # SOURCE CODE MOUNTS - Live sync from host for development hot-reload
      # These override the COPY'd source in the image with current host files
      # HOST_PROJECT_ROOT resolves DinD path translation (defaults to "." for native Docker)
      - ${HOST_PROJECT_ROOT:-.}/src:/app/src:ro
      - ${HOST_PROJECT_ROOT:-.}/Cargo.toml:/app/Cargo.toml:ro
      - ${HOST_PROJECT_ROOT:-.}/Cargo.lock:/app/Cargo.lock:rw
      - ${HOST_PROJECT_ROOT:-.}/build.rs:/app/build.rs:ro
      - ${HOST_PROJECT_ROOT:-.}/crates:/app/crates:ro
      - ${HOST_PROJECT_ROOT:-.}/docs:/app/docs:ro
      # solid-pod-rs + whelk-rs are crates.io deps — fetched into cargo cache, no bind mount needed.
      - ${HOST_PROJECT_ROOT:-.}/client/src:/app/client/src:ro
      - ${HOST_PROJECT_ROOT:-.}/client/public:/app/client/public:ro
      - ${HOST_PROJECT_ROOT:-.}/client/index.html:/app/client/index.html:ro
      - ${HOST_PROJECT_ROOT:-.}/client/vite.config.ts:/app/client/vite.config.ts:ro
      - ${HOST_PROJECT_ROOT:-.}/client/tsconfig.json:/app/client/tsconfig.json:ro
      # Cache volumes for build optimization
      - npm-cache:/root/.npm
      - cargo-cache:/root/.cargo/registry
      - cargo-git-cache:/root/.cargo/git
      - cargo-target-cache:/app/target
      # Docker socket for controlled access (development only)
      # DEV ONLY — never enable in production. The prod service deliberately omits
      # this mount; exposing the host Docker socket grants effective root on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount host data directory for graph content
      - ${HOST_PROJECT_ROOT:-.}/data/markdown:/workspace/ext/data/markdown:ro
      - ${HOST_PROJECT_ROOT:-.}/data/metadata:/workspace/ext/data/metadata:rw
    ports:
      # Development: Nginx entry point + API port
      - "${DEV_NGINX_PORT:-3001}:3001"
      - "${API_PORT:-4000}:4000"
    networks:
      visionclaw_network:
        aliases:
          - ${NETWORK_ALIAS:-visionclaw-server}
    deploy:
      <<: *gpu-resources
    runtime: nvidia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      <<: *common-logging
    profiles:
      - development
      - dev

  # Production profile configuration
  visionclaw-production:
    container_name: ${CONTAINER_NAME:-visionclaw_prod_container}
    hostname: ${HOSTNAME:-visionclaw-server-prod}
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        CUDA_ARCH: ${CUDA_ARCH:-75}
        BUILD_TARGET: production
        REBUILD_PTX: ${REBUILD_PTX:-false}
        VITE_PUBLIC_DEMO: ${VITE_PUBLIC_DEMO:-false}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      <<: *common-environment
      # Production-specific overrides
      NODE_ENV: production
      RUST_LOG: ${RUST_LOG:-info}
      GIT_HASH: ${GIT_HASH:-production}
      VITE_DEBUG: "false"
      # Writable production paths live under the persistent /app/data volume.
      # Development defaults point at bind-mounted /workspace/ext paths and are
      # not valid in the non-root production image.
      DATA_ROOT: /app/data
      MARKDOWN_DIR: /app/data/markdown
      METADATA_DIR: /app/data/metadata
      SOLID_DATA_ROOT: /app/data/solid
      # CORS — must include production domain so nginx can pass real Origin
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://junkiejarvis.com,http://localhost:3000,http://localhost:3001}
      # ComfyUI image generation
      COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
      COMFYUI_SALAD_URL: ${COMFYUI_SALAD_URL:-http://comfyui:3000}
      # Solid pod storage for agent pipeline
      SOLID_PROXY_SECRET_KEY: ${SOLID_PROXY_SECRET_KEY}
      # Fail fast in production if the agent key is unset — no insecure default.
      VISIONCLAW_AGENT_KEY: ${VISIONCLAW_AGENT_KEY:?VISIONCLAW_AGENT_KEY must be set}
      # Nostr bead provenance bridge — scoped here only, never in common-environment
      VISIONCLAW_NOSTR_PRIVKEY: ${VISIONCLAW_NOSTR_PRIVKEY:-}
      FORUM_RELAY_URL: ${FORUM_RELAY_URL:-wss://dreamlab-nostr-relay.solitary-paper-764d.workers.dev}
    volumes:
      # Production: ONLY data volumes (no source mounts, no Docker socket)
      - visionclaw-data:/app/data
      - visionclaw-logs:/app/logs
    ports:
      # Production: Only API port
      - "${PROD_API_PORT:-3001}:3001"
    networks:
      visionclaw_network:
        aliases:
          - ${NETWORK_ALIAS:-visionclaw-server}
    deploy:
      <<: *gpu-resources
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 2G
          cpus: '1'
    runtime: nvidia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      <<: *common-logging
    profiles:
      - production
      - prod

  # Cloudflare tunnel - works with both profiles
  cloudflared:
    container_name: ${CLOUDFLARED_CONTAINER:-cloudflared-tunnel}
    # Pinned to the locally-available digest for reproducible production builds.
    image: cloudflare/cloudflared:latest@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      visionclaw:
        condition: service_started
        required: false
      visionclaw-production:
        condition: service_started
        required: false
    networks:
      - visionclaw_network
    restart: unless-stopped
    logging:
      <<: *common-logging
    profiles:
      - production
      - prod

  # ── Ontology Loom sidecar (Deployment B — VisionClaw ADR-135 D1 / PRD-025) ──
  # A portable ontology node with a stable, model-swappable façade. Co-located by
  # default (the usual all-on-one-machine case): reachable at http://loom:8080 on
  # visionclaw_network by VisionClaw and agentbox. The model is a URL behind the
  # façade (DISTILL_BACKEND_URL) — swap Gemma → Muse → next with zero consumer
  # change. Corpus generation is mirrored on start into the loom-data volume;
  # retrieval (/loom/scaffold, /health) works with NO backend configured.
  # Opt-in: docker compose --profile loom up -d loom   (or launch.sh with the loom profile)
  loom:
    container_name: ${LOOM_CONTAINER:-loom-sidecar}
    build:
      context: ./loom
      dockerfile: Dockerfile
    image: ${LOOM_IMAGE:-loom-sidecar:dev}
    environment:
      # Model-swap seam. Default co-located options (pick one at deploy):
      #   http://host.docker.internal:11434/v1  (local Ollama/LM Studio on the host)
      #   http://192.168.2.132:8084/v1          (LAN reasoner, e.g. HP-Desktop)
      # Blank = retrieval-only (scaffold + health work; /v1 returns 503).
      DISTILL_BACKEND_URL: ${DISTILL_BACKEND_URL:-}
      ONTOLOGY_BUDGET: ${LOOM_BUDGET:-1500}
      LOOM_MIRROR_ON_START: ${LOOM_MIRROR_ON_START:-1}
      ONTOLOGY_SITE: ${ONTOLOGY_SITE:-https://narrativegoldmine.com}
    volumes:
      # Corpus generation (mirrored on start). Bind a logseq www/data here for a
      # fully-offline co-located generation: ${HOST_PROJECT_ROOT:-.}/../logseq/www/data:/app/data
      - loom-data:/app/data
    ports:
      - "${LOOM_PORT:-8090}:8080"
    networks:
      visionclaw_network:
        aliases:
          - loom
          - ontology-loom
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      <<: *common-logging
    profiles:
      - loom

networks:
  visionclaw_network:
    external: true
    name: ${EXTERNAL_NETWORK:-visionclaw_network}

volumes:
  # Ontology Loom mirrored corpus generation
  loom-data:
    name: ${LOOM_DATA_VOLUME:-loom-data}
    driver: local
  # Persistent data volumes
  visionclaw-data:
    name: ${DATA_VOLUME_NAME:-visionclaw-data}
    driver: local
  visionclaw-logs:
    name: ${LOGS_VOLUME_NAME:-visionclaw-logs}
    driver: local
  # Build cache volumes
  npm-cache:
    name: ${NPM_CACHE_VOLUME:-visionclaw-npm-cache}
    driver: local
  cargo-cache:
    name: ${CARGO_CACHE_VOLUME:-visionclaw-cargo-cache}
    driver: local
  cargo-git-cache:
    name: ${CARGO_GIT_CACHE_VOLUME:-visionclaw-cargo-git-cache}
    driver: local
  cargo-target-cache:
    name: ${CARGO_TARGET_CACHE_VOLUME:-visionclaw-cargo-target-cache}
    driver: local
