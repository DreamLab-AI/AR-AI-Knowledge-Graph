[package]
name = "visionclaw-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Network-level integration probes (HTTP/WS/TCP) against a running VisionClaw server."
authors = ["jjohare <github@thedreamlab.uk>"]

[dependencies]
# Feature sets deliberately MATCH the root visionclaw-server crate so that adding
# this member to the workspace is a no-op for Cargo's feature unification and
# cannot change how the server binary links TLS.
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
reqwest = { version = "0.12.23", features = ["json"] }
futures-util = "0.3"
serde_json = "1.0"
nvml-wrapper = "0.13"
