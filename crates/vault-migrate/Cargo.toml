[package]
name = "vault-migrate"
version = "0.1.0"
edition = "2021"
description = "Deterministic Logseq -> Obsidian vault converter (ADR-2042, docs/VAULT-corpus-format.md V6)"
authors = ["jjohare <github@thedreamlab.uk>"]
license = "AGPL-3.0-only"

[[bin]]
name = "vault-migrate"
path = "src/main.rs"

[lib]
name = "vault_migrate"
path = "src/lib.rs"

# Deliberately depends on NO workspace crate. visionclaw-domain pulls the
# server's dependency graph (and transitively the GPU stack) into what must
# stay a small, CUDA-free, fast-building binary. The only logic that would
# have been reused is page-name -> path mapping, which is reimplemented in
# `paths.rs` (~60 lines) against the same V1 rules.
[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
anyhow = "1"
rayon = "1"

[dev-dependencies]
tempfile = "3"
walkdir = "2"
